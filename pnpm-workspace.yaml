packages:
  - apps/*
  - packages/*
allowBuilds:
  argon2: true
# ponytail: pin the keyv/cacheable family to the resolved clean releases; the next
# patch of each (keyv 6.0.0, flat-cache 6.1.24, file-entry-cache 11.1.6, cacheable 2.5.1,
# @cacheable/memory 2.2.1, @cacheable/utils 2.5.1) is the ChainDrop-compromised one.
overrides:
  keyv: 5.6.0
  flat-cache: 6.1.23
  file-entry-cache: 11.1.5
  cacheable: 2.5.0
  '@cacheable/memory': 2.2.0
  '@cacheable/utils': 2.5.0
