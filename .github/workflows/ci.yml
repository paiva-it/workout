name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0.34
        ports: ["27118:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm validate:pack
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps --only-shell chromium && pnpm e2e
