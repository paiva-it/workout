name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  check:
    # mongo 8.0.x refuses to start on kernel >=6.19 (SERVER-121912), which ubuntu-24.04 runners now ship; back to ubuntu-latest once a fixed mongo tag exists
    runs-on: ubuntu-22.04
    services:
      mongo:
        image: mongo:8.0.34
        ports: ["27118:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24.22.1 }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm validate:pack
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps --only-shell chromium && pnpm e2e
